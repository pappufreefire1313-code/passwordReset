<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AawazSetu</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/password-reset.css') }}">
</head>
<body>

<div class="form-container">
    <h2>Forgot Password</h2>

    {% if message %}
        <div class="success-msg">{{ message }}</div>
    {% else %}
        <p class="intro">Enter the email address you registered with and we will send you a link to reset your password.</p>

        <form action="{{ url_for('password_reset.forgot_password') }}" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email" autocomplete="email">
            </div>
            <button type="submit">Send Reset Link</button>
        </form>
    {% endif %}

    <div class="links">
        <p><a href="/login">Back to Login</a></p>
    </div>
</div>

</body>
</html>
