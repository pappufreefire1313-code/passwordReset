<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Reset Password - AawazSetu</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/password-reset.css') }}">
</head>
<body>

<div class="form-container">
    <h2>Choose a New Password</h2>

    {% if errors %}
        <div class="error-msg">
            <ul>
            {% for error in errors %}
                <li>{{ error }}</li>
            {% endfor %}
            </ul>
        </div>
    {% endif %}

    <form action="{{ url_for('password_reset.reset_password') }}" method="POST">
        <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" required
                   minlength="{{ min_length }}" autocomplete="new-password">
            <div class="hint">At least {{ min_length }} characters, including a letter and a number.</div>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required
                   minlength="{{ min_length }}" autocomplete="new-password">
        </div>

        <button type="submit">Reset Password</button>
    </form>

    <div class="links">
        <p><a href="/login">Back to Login</a></p>
    </div>
</div>

</body>
</html>
